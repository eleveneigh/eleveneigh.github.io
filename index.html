---
layout: default
title: Home
body_class: home-page
---

{% assign profile = site.data.profile %}

<div class="main-content">
  <section class="home-hero">
    <div class="home-hero-text">
      <h1>Leyan Wu</h1>
      <p class="home-tagline">{{ profile.hero }}</p>
      <p class="home-cta">
        <a href="{{ '/about/' | relative_url }}">{{ profile.hero_cta }}</a>
      </p>
    </div>
    <div class="home-hero-photo">
      <img
        src="{{ profile.photo | relative_url }}"
        alt="Leyan Wu"
        width="731"
        height="1093"
        loading="eager"
      >
    </div>
  </section>
</div>
