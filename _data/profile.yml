hero: >
  I design co-creative systems that use intentional friction—not seamless automation—to
  support reflective making, emotional well-being, and human agency in AI-mediated creativity.

hero_cta: About me →

identity: >
  Before I ran a single user study, I was pointing a RED camera at people who didn't quite know
  what to do with their hands, and writing poems that refused to resolve cleanly. I'm Leyan (Robin)—a
  CS & Applied Mathematics student at Duke Kunshan University, now researching Human-Computer
  Interaction, affective computing, and AI-assisted creativity.

photo: /assets/images/contact-hero.jpg

vision: >
  I design co-creative systems that use intentional friction to support reflective making,
  emotional well-being, and human agency in AI-mediated creativity.

vision_note: >
  Film and poetry taught me this before research did: meaning tends to show up in the gap between
  what you planned and what actually happened. My work now asks whether AI-mediated systems can
  hold that same gap open, instead of smoothing it away.

interests:
  - Co-creative and embodied interaction
  - Critical and reflective approaches to AI in creative practice
  - Technology for emotional well-being and mental health

methods:
  - Co-design workshops and semi-structured interviews
  - Prototyping with multimodal sensing and generative feedback
  - Thematic and statistical analysis of user study data

looking_for: >
  MS/PhD opportunities in interdisciplinary HCI labs where design, research, and
  creative practice inform one another.

wolfgang: >
  Outside of labs and film sets, I'm mostly owned by Wolfgang—a former stray who now owns a lot of
  love (and most of my desk chair).

