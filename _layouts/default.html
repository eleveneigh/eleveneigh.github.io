<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body class="{% if page.body_class %}{{ page.body_class }}{% endif %}">

    <a class="skip-link" href="#main-content">{{ site.skip_link_text | default: "Skip to content" }}</a>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content" id="main-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
